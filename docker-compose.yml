name: uotap

x-app: &app
  build: ./app
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  networks: [app-net]

services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal} -d ${POSTGRES_DB:-portal}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app-net]

  redis:
    image: redis:7.4
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app-net]

  django:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  celery-worker:
    <<: *app
    command: celery -A config worker -l info
    depends_on:
      django: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  celery-beat:
    <<: *app
    command: celery -A config beat -l info -s /var/lib/beat/celerybeat-schedule
    depends_on:
      django: { condition: service_healthy }
    volumes: [beatdata:/var/lib/beat]
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/beat/celerybeat-schedule* || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  app-net:

volumes:
  pgdata:
  redisdata:
  beatdata:
