name: uotap

# Shared OTel settings for every app container. The app only knows the Collector's OTLP
# address; backends (Prometheus, Elastic, Datadog) are configured in the Collector, not here.
x-otel: &otel
  ENVIRONMENT: ${ENVIRONMENT:-dev}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${ENVIRONMENT:-dev},service.version=${APP_VERSION:-0.1.0}
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_PYTHON_DJANGO_EXCLUDED_URLS: healthz,readyz
  OTEL_PYTHON_DJANGO_INSTRUMENT: "true"

# Common settings for the three app-side containers (web, worker, beat share one image).
x-app: &app
  build: ./app
  env_file: .env
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  networks: [app-net, telemetry-net]

services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal} -d ${POSTGRES_DB:-portal}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app-net]

  redis:
    image: redis:7.4
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app-net]

  # One-shot: turns the EXPORT_* on/off flags into the Collector's routing config.
  # Re-runs whenever its env changes (`make collector-reload` after editing fragments).
  otel-config:
    image: python:3.12-slim
    command: python /src/render_config.py
    environment:
      # Flags are ON by default so one `make up` shows every destination working.
      # Set a flag to false in .env to stop sending to that destination.
      EXPORT_DEBUG: ${EXPORT_DEBUG:-true}
      EXPORT_PROMETHEUS: ${EXPORT_PROMETHEUS:-true}
      EXPORT_ELASTICSEARCH: ${EXPORT_ELASTICSEARCH:-true}
      EXPORT_LOGSTASH: ${EXPORT_LOGSTASH:-true}
    volumes:
      - ./observability/otel-collector:/src:ro
      - otelcol-generated:/generated
      - otelcol-queue:/queue     # chowned for the Collector's non-root user
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    # Static building blocks (base.yaml) + generated routing (exporters + pipelines).
    command:
      - --config=/etc/otelcol/base.yaml
      - --config=/generated/routing.yaml
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DEBUG_EXPORTER_VERBOSITY: ${DEBUG_EXPORTER_VERBOSITY:-basic}
      ES_WRITER_PASSWORD: ${ES_WRITER_PASSWORD:-}
      LOGSTASH_INPUT_PASSWORD: ${LOGSTASH_INPUT_PASSWORD:-}
    volumes:
      - ./observability/otel-collector:/etc/otelcol:ro
      - otelcol-generated:/generated:ro
      - otelcol-queue:/queue
    depends_on:
      otel-config: { condition: service_completed_successfully }
    # No Compose healthcheck: the contrib image is distroless (no shell/curl). Liveness is
    # exposed on :13133 (health_check) and watched by Prometheus via the :8888 `up` metric.
    networks: [telemetry-net, backend-net]

  # ---- Elastic stack -------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node          # demo only: no HA
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes: [esdata:/usr/share/elasticsearch/data]
    ports: ["127.0.0.1:9200:9200"]
    ulimits: { memlock: { soft: -1, hard: -1 } }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:$$ELASTIC_PASSWORD 'localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: [backend-net]

  # One-shot: users, retention policy, index templates (see observability/elasticsearch/setup.py).
  es-setup:
    image: python:3.12-slim
    command: python /src/setup.py
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?set KIBANA_SYSTEM_PASSWORD in .env}
      ES_WRITER_PASSWORD: ${ES_WRITER_PASSWORD:?set ES_WRITER_PASSWORD in .env}
      ES_READER_PASSWORD: ${ES_READER_PASSWORD:?set ES_READER_PASSWORD in .env}
    volumes: [./observability/elasticsearch:/src:ro]
    depends_on:
      elasticsearch: { condition: service_healthy }
    restart: "no"
    networks: [backend-net]

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
      ES_WRITER_PASSWORD: ${ES_WRITER_PASSWORD}
      LOGSTASH_INPUT_PASSWORD: ${LOGSTASH_INPUT_PASSWORD:?set LOGSTASH_INPUT_PASSWORD in .env}
    volumes:
      - ./observability/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./observability/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      es-setup: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:9600 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [backend-net]   # reachable only from the Collector's backend side, not by app containers

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?set KIBANA_ENCRYPTION_KEY in .env}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
      TELEMETRY_OPTIN: "false"
    ports: ["127.0.0.1:5601:5601"]
    depends_on:
      es-setup: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [backend-net]

  # One-shot: data views, saved searches and a dashboard (see observability/kibana/setup.py).
  kibana-setup:
    image: python:3.12-slim
    command: python /src/setup.py
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    volumes: [./observability/kibana:/src:ro]
    depends_on:
      kibana: { condition: service_healthy }
    restart: "no"
    networks: [backend-net]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      ES_READER_PASSWORD: ${ES_READER_PASSWORD:-}   # read by the datasource provisioning file
    volumes:
      # Everything is provisioned from files: datasources, dashboards, alert rules.
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend-net]

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend-net]

  django:
    <<: *app
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: portal-django
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  celery-worker:
    <<: *app
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: portal-celery-worker
    command: celery -A config worker -l info
    depends_on:
      django: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  celery-beat:
    <<: *app
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: portal-celery-beat
    command: celery -A config beat -l info -s /var/lib/beat/celerybeat-schedule
    depends_on:
      django: { condition: service_healthy }
    volumes: [beatdata:/var/lib/beat]
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/beat/celerybeat-schedule* || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

# app-net: business traffic (db/cache). telemetry-net: OTLP to the Collector only.
# Postgres and Redis are deliberately not on telemetry-net.
networks:
  app-net:
  telemetry-net:
  backend-net:   # Collector -> storage/visualisation backends; app containers are not on it

volumes:
  pgdata:
  redisdata:
  beatdata:
  promdata:
  otelcol-generated:
  otelcol-queue:
  esdata:
  grafanadata:
