# Second logs path: Collector --(OTLP/JSON over HTTP)--> Logstash --> Elasticsearch.
# The Collector already writes logs to Elasticsearch directly; this path exists to show
# Logstash's role (parse / enrich / route) and lands in its own data stream so the two
# paths can be compared: logs-portal-logstash-default.
input {
  # Basic auth: only the Collector (which holds the password) may post logs here.
  http { port => 8080 codec => json user => "otel-collector" password => "${LOGSTASH_INPUT_PASSWORD}" }
}

filter {
  # One OTLP request holds resourceLogs -> scopeLogs -> logRecords. Emit one event per record.
  ruby {
    code => '
      kv = lambda { |attrs| (attrs || []).each_with_object({}) { |a, h| h[a["key"]] = a["value"].values.first } }
      (event.get("resourceLogs") || []).each do |rl|
        res = kv.call(rl.dig("resource", "attributes"))
        (rl["scopeLogs"] || []).each do |sl|
          (sl["logRecords"] || []).each do |lr|
            doc = {
              "@timestamp" => Time.at(lr["timeUnixNano"].to_i / 1_000_000_000.0).utc.iso8601(3),
              "message"    => lr.dig("body", "stringValue"),
              "log"        => { "level" => lr["severityText"] },
              "service"    => { "name" => res["service.name"], "environment" => res["deployment.environment"] },
              "labels"     => kv.call(lr["attributes"]),
              "pipeline"   => "logstash"
            }
            doc["trace"] = { "id" => lr["traceId"] } unless lr["traceId"].to_s.empty?
            doc["span"]  = { "id" => lr["spanId"] }  unless lr["spanId"].to_s.empty?
            new_event_block.call(LogStash::Event.new(doc))
          end
        end
      end
      event.cancel   # drop the raw envelope, only the per-record events continue
    '
  }
  mutate { remove_field => ["host", "headers", "http", "url", "user_agent", "@version"] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "portal_writer"
    password => "${ES_WRITER_PASSWORD}"
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "portal-logstash"
    data_stream_namespace => "default"
  }
}
