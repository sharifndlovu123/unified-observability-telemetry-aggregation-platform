# routing: exporter=elasticsearch signals=logs,traces default=true
# Logs and traces -> Elasticsearch data streams (logs-portal-default, traces-portal-default).
# `ecs` mapping gives Kibana-friendly fields: @timestamp, log.level, message, trace.id,
# span.id, service.name.
#
# RESILIENCE CAVEAT (verified by Scenario 6, Collector 0.116): `retry` here only retries HTTP
# status failures from a REACHABLE cluster (429/502/503/504), i.e. an overloaded Elasticsearch.
# If Elasticsearch is UNREACHABLE the exporter logs "Exporting failed. Dropping data." and the
# batch is lost; `retry_on_failure` is not supported for this exporter (checked up to 0.140).
# `sending_queue` only buffers batches in flight. For durable log delivery use the Logstash
# path (exporters.logstash.yaml), whose standard exporter retries on connection failure.
extensions:
  file_storage:
    directory: /queue
    timeout: 5s

exporters:
  elasticsearch:
    endpoints: [http://elasticsearch:9200]
    user: portal_writer
    password: ${env:ES_WRITER_PASSWORD}
    logs_index: logs-portal-default
    traces_index: traces-portal-default
    mapping: { mode: ecs }
    retry: { enabled: true, initial_interval: 1s, max_interval: 30s, max_requests: 10 }
    sending_queue: { enabled: true, num_consumers: 2, queue_size: 5000, storage: file_storage }
