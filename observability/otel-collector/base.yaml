# Shared building blocks. Exporters live in exporters.*.yaml (one file per destination);
# pipelines.yaml chooses which of them each signal uses.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  # Must be first in every pipeline: sheds load before the Collector runs out of memory.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  # Stamps every signal with the same environment/gateway labels, regardless of source.
  resource:
    attributes:
      - { key: deployment.environment, value: "${env:ENVIRONMENT:-dev}", action: upsert }
      - { key: telemetry.gateway, value: otel-collector, action: insert }
  # Drops liveness/readiness noise (defence in depth: the app already excludes these).
  filter/noise:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.target"] == "/healthz"'
        - 'attributes["http.target"] == "/readyz"'
  # Must be last: groups data into fewer, larger exports to backends.
  batch:
    timeout: 5s
    send_batch_size: 8192

extensions:
  # Liveness probe for the Collector itself (:13133). The image has no shell/curl, so
  # Compose can't probe it; Prometheus watches `up{job="otel-collector-self"}` instead.
  health_check:
    endpoint: 0.0.0.0:13133

  # Placeholder so a signal with every destination switched off is still a valid pipeline.
exporters:
  nop:

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: detailed
      address: 0.0.0.0:8888   # the Collector's own metrics (queue sizes, send failures)
